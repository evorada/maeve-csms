[api]
addr = ":9410"
internal_addr = ":9412"

# Local runs have no platform that mints tokens: every request to the API is accepted as
# a caller with all permissions. The manager only starts in this mode with ENVIRONMENT=dev.
[api.auth]
mode = "dev"

# A caller only reaches the tenants at and below its own org: the dev caller is a caller
# of dev1 and manages the charge stations, tokens and locations of dev1. Use the org id
# of dev2 to work on dev2.
[api.auth.dev]
org_id = "0193b2c4-0000-7000-8000-000000000001"

# Two tenants for manual runs without a platform. The tenant of a station is the one that
# has the host of the URL that the station connects to: ws://localhost:<port>/ws/<id> is
# a station of dev1, ws://127.0.0.1:<port>/ws/<id> a station of dev2. A station is
# registered under its key, e.g. dev1.cs001 and dev2.cs001.
[tenancy]
mode = "multi"

[[tenancy.bootstrap_tenants]]
org_id = "0193b2c4-0000-7000-8000-000000000001"
slug = "dev1"
org_key = "dev1"
hostnames = ["localhost"]

[[tenancy.bootstrap_tenants]]
org_id = "0193b2c4-0000-7000-8000-000000000002"
slug = "dev2"
org_key = "dev2"
hostnames = ["127.0.0.1"]

# The gateway and the manager exchange the OCPP messages through the NATS server of
# docker-compose. For MQTT: type = "mqtt" and mqtt.urls = ["mqtt://mqtt:1883"], a
# broker in docker-compose and --transport mqtt for the gateway.
[transport]
type = "nats"

[nats]
urls = ["nats://nats:4222"]

# The domain events go from the outbox to the CPMS_EVENTS stream of the NATS server of
# docker-compose (started with JetStream); in development the manager creates it.
[events]
ensure_stream = true

# The background jobs run on one manager at a time, coordinated through leases in the
# maeve_job_leases KV bucket of the same NATS server; in development the manager creates it.
[jobs]
ensure_bucket = true

[ocpi]
addr = ":9411"
external_url = "http://manager:9411"
country_code = "GB"
party_id = "TWK"

[storage]
type = "postgres"
[storage.postgres]
host = "postgres"
port = 5432
database = "maeve"
user = "maeve"
password = "maeve"
ssl_mode = "disable"
run_migrations = true
migrations_path = "file:///migrations"

[contract_cert_validator]
type = "ocsp"

[contract_cert_validator.ocsp.root_certs]
type = "opcp"
opcp.url = "https://open.plugncharge-test.hubject.com"
opcp.ttl = "24h"
opcp.auth.type = "hubject_test_token"
opcp.auth.hubject_test_token.url = "https://hubject.stoplight.io/api/v1/projects/cHJqOjk0NTg5/nodes/6bb8b3bc79c2e-authorization-token"
opcp.auth.hubject_test_token.ttl = "6h"

[contract_cert_provider]
type = "opcp"
opcp.url = "https://open.plugncharge-test.hubject.com"
opcp.auth.type = "hubject_test_token"
opcp.auth.hubject_test_token.url = "https://hubject.stoplight.io/api/v1/projects/cHJqOjk0NTg5/nodes/6bb8b3bc79c2e-authorization-token"
opcp.auth.hubject_test_token.ttl = "6h"

[charge_station_cert_provider]
type = "delegating"
delegating.v2g.type = "opcp"
delegating.v2g.opcp.url = "https://open.plugncharge-test.hubject.com"
delegating.v2g.opcp.auth.type = "hubject_test_token"
delegating.v2g.opcp.auth.hubject_test_token.url = "https://hubject.stoplight.io/api/v1/projects/cHJqOjk0NTg5/nodes/6bb8b3bc79c2e-authorization-token"
delegating.v2g.opcp.auth.hubject_test_token.ttl = "6h"
delegating.cso.type = "local"
delegating.cso.local.cert.type = "file"
delegating.cso.local.cert.file = "/certificates/csms.pem"
delegating.cso.local.key.type = "file"
delegating.cso.local.key.file = "/certificates/csms.key"
