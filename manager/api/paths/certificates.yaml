paths:
  /cs/{csId}/certificates:
    get:
      summary: Get installed certificates from the charge station
      description: |
        Queries the charge station for installed certificates. Uses OCPP
        GetInstalledCertificateIds to retrieve certificate hash data for certificates
        currently installed on the charge station.

        For an OCPP 1.6 charge station the request becomes a `GetInstalledCertificateIds`
        command of the command queue (`GET /commands/{commandId}`), whose result holds the
        certificates. OCPP 1.6 knows two types: `CSMSRootCertificate` (sent as
        `CentralSystemRootCertificate`) and `ManufacturerRootCertificate`; another type, or
        no type, is refused (400).
      operationId: getInstalledCertificates
      x-permission: cpms.station.read
      parameters:
      - name: csId
        in: path
        description: The charge station identifier
        schema:
          type: string
          maxLength: 80
      - name: certificateType
        in: query
        description: Optional filter by certificate type
        required: false
        schema:
          type: string
          enum:
          - V2GRootCertificate
          - MORootCertificate
          - CSMSRootCertificate
          - V2GCertificateChain
          - ManufacturerRootCertificate
      responses:
        '202':
          description: |
            Request accepted, will query charge station asynchronously.
            For an OCPP 1.6 charge station the request is queued as a command:
            `operationId` is the id of the command, the outcome is its result, and
            `Location` names it. For other charge stations `operationId` is the charge
            station identifier.
          headers:
            Location:
              description: Where the command can be read (OCPP 1.6 charge stations only)
              schema:
                type: string
          content:
            application/json:
              schema:
                $ref: '../schemas/schemas.yaml#/components/schemas/OperationResponse'
        '400':
          description: |
            For an OCPP 1.6 charge station: no `certificateType`, or a type that OCPP 1.6
            does not have (`not supported for OCPP 1.6 stations`)
          content:
            application/json:
              schema:
                $ref: '../schemas/schemas.yaml#/components/schemas/Status'
        '401':
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: '../schemas/schemas.yaml#/components/schemas/Status'
        '403':
          description: The caller does not have the permission of the operation
          content:
            application/json:
              schema:
                $ref: '../schemas/schemas.yaml#/components/schemas/Status'
        '404':
          description: Unknown charge station
          content:
            application/json:
              schema:
                $ref: '../schemas/schemas.yaml#/components/schemas/Status'
        '409':
          description: |
            The OCPP version of the charge station could not be found when the command
            was queued (error `station_version_unknown`)
          content:
            application/json:
              schema:
                $ref: '../schemas/schemas.yaml#/components/schemas/Status'
        default:
          description: Unexpected error
          content:
            application/json:
              schema:
                $ref: '../schemas/schemas.yaml#/components/schemas/Status'
    post:
      summary: Install certificates on the charge station
      operationId: installChargeStationCertificates
      x-permission: cpms.station.write
      parameters:
      - name: csId
        in: path
        description: The charge station identifier
        schema:
          type: string
          maxLength: 80
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '../schemas/schemas.yaml#/components/schemas/ChargeStationInstallCertificates'
      responses:
        '200':
          description: OK
        '401':
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: '../schemas/schemas.yaml#/components/schemas/Status'
        '403':
          description: The caller does not have the permission of the operation, or the tenant is suspended (error `tenant_suspended`)
          content:
            application/json:
              schema:
                $ref: '../schemas/schemas.yaml#/components/schemas/Status'
        '404':
          description: Unknown charge station
          content:
            application/json:
              schema:
                $ref: '../schemas/schemas.yaml#/components/schemas/Status'
        default:
          description: Unexpected error
          content:
            application/json:
              schema:
                $ref: '../schemas/schemas.yaml#/components/schemas/Status'
  /cs/{csId}/certificate:
    delete:
      summary: Delete a certificate from the charge station
      description: |
        Requests the charge station to delete a specific certificate identified by its hash
        data. Uses OCPP DeleteCertificate to remove the certificate from the charge station.

        For an OCPP 1.6 charge station the request becomes a `DeleteCertificate` command of
        the command queue (`GET /commands/{commandId}`): it is sent when the charge station is
        connected, and the answer of the charge station is the result of the command.
      operationId: deleteChargeStationCertificate
      x-permission: cpms.station.write
      parameters:
      - name: csId
        in: path
        description: The charge station identifier
        schema:
          type: string
          maxLength: 80
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '../schemas/schemas.yaml#/components/schemas/CertificateHashDataRequest'
      responses:
        '202':
          description: |
            Request accepted, will delete certificate asynchronously.
            For an OCPP 1.6 charge station the request is queued as a command:
            `operationId` is the id of the command, the outcome is its result, and
            `Location` names it. For other charge stations `operationId` is the charge
            station identifier.
          headers:
            Location:
              description: Where the command can be read (OCPP 1.6 charge stations only)
              schema:
                type: string
          content:
            application/json:
              schema:
                $ref: '../schemas/schemas.yaml#/components/schemas/OperationResponse'
        '400':
          description: |
            The request is not valid. For an OCPP 1.6 charge station the error starts with
            `invalid_payload` (followed by the schema error) when the request does not make
            a valid OCPP call.
          content:
            application/json:
              schema:
                $ref: '../schemas/schemas.yaml#/components/schemas/Status'
        '401':
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: '../schemas/schemas.yaml#/components/schemas/Status'
        '403':
          description: The caller does not have the permission of the operation, or the tenant is suspended (error `tenant_suspended`)
          content:
            application/json:
              schema:
                $ref: '../schemas/schemas.yaml#/components/schemas/Status'
        '404':
          description: Unknown charge station
          content:
            application/json:
              schema:
                $ref: '../schemas/schemas.yaml#/components/schemas/Status'
        '409':
          description: |
            The OCPP version of the charge station could not be found when the command
            was queued (error `station_version_unknown`)
          content:
            application/json:
              schema:
                $ref: '../schemas/schemas.yaml#/components/schemas/Status'
        default:
          description: Unexpected error
          content:
            application/json:
              schema:
                $ref: '../schemas/schemas.yaml#/components/schemas/Status'
  /certificate:
    post:
      summary: Upload a certificate
      description: 'Uploads a client certificate to the CSMS. The CSMS can use the
        certificate to authenticate

        the charge station using mutual TLS when the TLS operations are being offloaded
        to a load-balancer.

        '
      operationId: uploadCertificate
      x-permission: cpms.certificate.write
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '../schemas/schemas.yaml#/components/schemas/Certificate'
      responses:
        '201':
          description: Created
        '401':
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: '../schemas/schemas.yaml#/components/schemas/Status'
        '403':
          description: The caller does not have the permission of the operation
          content:
            application/json:
              schema:
                $ref: '../schemas/schemas.yaml#/components/schemas/Status'
        default:
          description: Unexpected error
          content:
            application/json:
              schema:
                $ref: '../schemas/schemas.yaml#/components/schemas/Status'
  /certificate/{certificateHash}:
    get:
      summary: Lookup a certificate
      description: 'Lookup a client certificate that has been uploaded to the CSMS
        using a base64 encoded SHA-256 hash

        of the DER bytes.

        '
      operationId: lookupCertificate
      x-permission: cpms.station.read
      parameters:
      - required: true
        in: path
        name: certificateHash
        schema:
          type: string
          maxLength: 64
      responses:
        '200':
          description: Certificate details
          content:
            application/json:
              schema:
                $ref: '../schemas/schemas.yaml#/components/schemas/Certificate'
        '401':
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: '../schemas/schemas.yaml#/components/schemas/Status'
        '403':
          description: The caller does not have the permission of the operation
          content:
            application/json:
              schema:
                $ref: '../schemas/schemas.yaml#/components/schemas/Status'
        '404':
          description: Not found
          content:
            application/json:
              schema:
                $ref: '../schemas/schemas.yaml#/components/schemas/Status'
        default:
          description: Unexpected error
          content:
            application/json:
              schema:
                $ref: '../schemas/schemas.yaml#/components/schemas/Status'
    delete:
      summary: Delete a certificate
      description: 'Deletes a client certificate that has been uploaded to the CSMS using a base64 encoded SHA-256 hash

        of the DER bytes.

        '
      operationId: deleteCertificate
      x-permission: cpms.certificate.write
      parameters:
      - required: true
        in: path
        name: certificateHash
        schema:
          type: string
          maxLength: 64
      responses:
        '204':
          description: No content
        '401':
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: '../schemas/schemas.yaml#/components/schemas/Status'
        '403':
          description: The caller does not have the permission of the operation
          content:
            application/json:
              schema:
                $ref: '../schemas/schemas.yaml#/components/schemas/Status'
        '404':
          description: Not found
          content:
            application/json:
              schema:
                $ref: '../schemas/schemas.yaml#/components/schemas/Status'
        default:
          description: Unexpected error
          content:
            application/json:
              schema:
                $ref: '../schemas/schemas.yaml#/components/schemas/Status'
