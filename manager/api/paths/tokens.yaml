paths:
  /token:
    post:
      summary: Create/update an authorization token
      description: 'Creates or updates a token that can be used to authorize a charge

        '
      operationId: setToken
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '../schemas/schemas.yaml#/components/schemas/Token'
      responses:
        '201':
          description: Created
        '401':
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: '../schemas/schemas.yaml#/components/schemas/Status'
        default:
          description: Unexpected error
          content:
            application/json:
              schema:
                $ref: '../schemas/schemas.yaml#/components/schemas/Status'
    get:
      summary: List authorization tokens
      description: 'Lists all tokens that can be used to authorize a charge

        '
      operationId: listTokens
      parameters:
      - required: false
        in: query
        name: offset
        schema:
          type: integer
          minimum: 0
      - required: false
        in: query
        name: limit
        schema:
          type: integer
          minimum: 1
          maximum: 100
      responses:
        '200':
          description: List of tokens
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '../schemas/schemas.yaml#/components/schemas/Token'
        '401':
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: '../schemas/schemas.yaml#/components/schemas/Status'
        default:
          description: Unexpected error
          content:
            application/json:
              schema:
                $ref: '../schemas/schemas.yaml#/components/schemas/Status'
  /token/{tokenUid}:
    get:
      summary: Lookup an authorization token
      description: 'Lookup a token that can be used to authorize a charge

        '
      operationId: lookupToken
      parameters:
      - required: true
        in: path
        name: tokenUid
        schema:
          type: string
          maxLength: 36
      responses:
        '200':
          description: Authorization token details
          content:
            application/json:
              schema:
                $ref: '../schemas/schemas.yaml#/components/schemas/Token'
        '401':
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: '../schemas/schemas.yaml#/components/schemas/Status'
        '404':
          description: Not found
          content:
            application/json:
              schema:
                $ref: '../schemas/schemas.yaml#/components/schemas/Status'
        default:
          description: Unexpected error
          content:
            application/json:
              schema:
                $ref: '../schemas/schemas.yaml#/components/schemas/Status'
