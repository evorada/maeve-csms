paths:
  /location/{locationId}:
    post:
      summary: Registers a location with the CSMS
      description: 'Registers a location with the CSMS.

        '
      operationId: registerLocation
      x-permission: cpms.station.write
      parameters:
      - name: locationId
        in: path
        description: The location identifier
        schema:
          type: string
          maxLength: 64
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '../schemas/schemas.yaml#/components/schemas/Location'
      responses:
        '201':
          description: Created
        '400':
          description: Invalid request, or `orgId` is missing for a caller whose own org is not a tenant here
          content:
            application/json:
              schema:
                $ref: '../schemas/schemas.yaml#/components/schemas/Status'
        '401':
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: '../schemas/schemas.yaml#/components/schemas/Status'
        '403':
          description: The caller does not have the permission of the operation
          content:
            application/json:
              schema:
                $ref: '../schemas/schemas.yaml#/components/schemas/Status'
        '404':
          description: The org is outside the scope of the caller
          content:
            application/json:
              schema:
                $ref: '../schemas/schemas.yaml#/components/schemas/Status'
        '409':
          description: The location id is already in use
          content:
            application/json:
              schema:
                $ref: '../schemas/schemas.yaml#/components/schemas/Status'
        default:
          description: Unexpected error
          content:
            application/json:
              schema:
                $ref: '../schemas/schemas.yaml#/components/schemas/Status'
