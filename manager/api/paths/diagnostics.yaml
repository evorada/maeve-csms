paths:
  /cs/{csId}/diagnostics:
    post:
      summary: Request diagnostics from charge station
      description: |
        Initiates a diagnostics upload from the specified charge station (OCPP 1.6).
        The charge station will collect diagnostics and upload them to the provided
        location.

        For an OCPP 1.6 charge station the request becomes a `GetDiagnostics` command of the
        command queue (`GET /commands/{commandId}`): it is sent when the charge station is
        connected, and the answer of the charge station (the name of the file it uploads) is
        the result of the command. The diagnostics status says `Uploading` once the charge
        station answered; for other charge stations it says so at once.
      operationId: requestChargeStationDiagnostics
      x-permission: cpms.connector.command
      parameters:
      - name: csId
        in: path
        required: true
        description: The charge station identifier
        schema:
          type: string
          maxLength: 80
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '../schemas/schemas.yaml#/components/schemas/DiagnosticsRequest'
      responses:
        '202':
          description: |
            Accepted - diagnostics request initiated.
            For an OCPP 1.6 charge station the request is queued as a command, which is
            the body, and `Location` names it. For other charge stations, and when the
            storage engine of the manager does not keep commands, the body is empty.
          headers:
            Location:
              description: Where the command can be read (OCPP 1.6 charge stations only)
              schema:
                type: string
          content:
            application/json:
              schema:
                $ref: '../schemas/schemas.yaml#/components/schemas/Command'
        '400':
          description: |
            The request is not valid. For an OCPP 1.6 charge station the error starts with
            `invalid_payload` (followed by the schema error) when the request does not make
            a valid OCPP call.
          content:
            application/json:
              schema:
                $ref: '../schemas/schemas.yaml#/components/schemas/Status'
        '401':
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: '../schemas/schemas.yaml#/components/schemas/Status'
        '403':
          description: The caller does not have the permission of the operation
          content:
            application/json:
              schema:
                $ref: '../schemas/schemas.yaml#/components/schemas/Status'
        '404':
          description: Unknown charge station
          content:
            application/json:
              schema:
                $ref: '../schemas/schemas.yaml#/components/schemas/Status'
        '409':
          description: |
            The OCPP version of the charge station could not be found when the command
            was queued (error `station_version_unknown`)
          content:
            application/json:
              schema:
                $ref: '../schemas/schemas.yaml#/components/schemas/Status'
  /cs/{csId}/diagnostics/status:
    get:
      summary: Get diagnostics upload status
      description: 'Returns the current diagnostics upload status for the specified
        charge station.

        '
      operationId: getChargeStationDiagnosticsStatus
      x-permission: cpms.station.read
      parameters:
      - name: csId
        in: path
        required: true
        description: The charge station identifier
        schema:
          type: string
          maxLength: 80
      responses:
        '200':
          description: Diagnostics status response
          content:
            application/json:
              schema:
                $ref: '../schemas/schemas.yaml#/components/schemas/DiagnosticsStatus'
        '401':
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: '../schemas/schemas.yaml#/components/schemas/Status'
        '403':
          description: The caller does not have the permission of the operation
          content:
            application/json:
              schema:
                $ref: '../schemas/schemas.yaml#/components/schemas/Status'
        '404':
          description: Unknown charge station
          content:
            application/json:
              schema:
                $ref: '../schemas/schemas.yaml#/components/schemas/Status'
  /cs/{csId}/logs:
    post:
      summary: Request log upload from charge station
      description: |
        Initiates a log upload from the specified charge station (OCPP 1.6 security
        extension and OCPP 2.0.1 GetLog).

        For an OCPP 1.6 charge station the request becomes a `GetLog` command of the command
        queue (`GET /commands/{commandId}`): it is sent when the charge station is connected,
        and the answer of the charge station is the result of the command. The log status
        changes when the charge station reports it (`LogStatusNotification`); for other
        charge stations it says `Uploading` at once.
      operationId: requestChargeStationLogs
      x-permission: cpms.connector.command
      parameters:
      - name: csId
        in: path
        required: true
        description: The charge station identifier
        schema:
          type: string
          maxLength: 80
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '../schemas/schemas.yaml#/components/schemas/LogRequest'
      responses:
        '202':
          description: |
            Accepted - log request initiated.
            For an OCPP 1.6 charge station the request is queued as a command, which is
            the body, and `Location` names it. For other charge stations, and when the
            storage engine of the manager does not keep commands, the body is empty.
          headers:
            Location:
              description: Where the command can be read (OCPP 1.6 charge stations only)
              schema:
                type: string
          content:
            application/json:
              schema:
                $ref: '../schemas/schemas.yaml#/components/schemas/Command'
        '400':
          description: |
            The request is not valid. For an OCPP 1.6 charge station the error starts with
            `invalid_payload` (followed by the schema error) when the request does not make
            a valid OCPP call.
          content:
            application/json:
              schema:
                $ref: '../schemas/schemas.yaml#/components/schemas/Status'
        '401':
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: '../schemas/schemas.yaml#/components/schemas/Status'
        '403':
          description: The caller does not have the permission of the operation
          content:
            application/json:
              schema:
                $ref: '../schemas/schemas.yaml#/components/schemas/Status'
        '404':
          description: Unknown charge station
          content:
            application/json:
              schema:
                $ref: '../schemas/schemas.yaml#/components/schemas/Status'
        '409':
          description: |
            The OCPP version of the charge station could not be found when the command
            was queued (error `station_version_unknown`)
          content:
            application/json:
              schema:
                $ref: '../schemas/schemas.yaml#/components/schemas/Status'
  /cs/{csId}/logs/status:
    get:
      summary: Get log upload status
      description: 'Returns the current log upload status for the specified charge
        station.

        '
      operationId: getChargeStationLogStatus
      x-permission: cpms.station.read
      parameters:
      - name: csId
        in: path
        required: true
        description: The charge station identifier
        schema:
          type: string
          maxLength: 80
      - name: requestId
        in: query
        required: false
        description: Filter by specific request ID
        schema:
          type: integer
      responses:
        '200':
          description: Log status response
          content:
            application/json:
              schema:
                $ref: '../schemas/schemas.yaml#/components/schemas/LogStatus'
        '401':
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: '../schemas/schemas.yaml#/components/schemas/Status'
        '403':
          description: The caller does not have the permission of the operation
          content:
            application/json:
              schema:
                $ref: '../schemas/schemas.yaml#/components/schemas/Status'
        '404':
          description: Unknown charge station
          content:
            application/json:
              schema:
                $ref: '../schemas/schemas.yaml#/components/schemas/Status'
