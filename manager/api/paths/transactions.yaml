paths:
  /cs/{csId}/transactions:
    get:
      summary: List transactions for a charge station
      description: 'Lists transactions for the specified charge station with optional
        filtering

        by status, date range, and pagination.

        '
      operationId: listTransactions
      x-permission: cpms.session.read
      parameters:
      - name: csId
        in: path
        description: The charge station identifier
        required: true
        schema:
          type: string
          maxLength: 80
      - name: status
        in: query
        description: 'Filter by transaction status (default: all)'
        required: false
        schema:
          type: string
          enum:
          - active
          - completed
          - all
          default: all
      - name: limit
        in: query
        description: 'Maximum number of transactions to return (default: 50, max:
          100)'
        required: false
        schema:
          type: integer
          minimum: 1
          maximum: 100
          default: 50
      - name: offset
        in: query
        description: 'Number of transactions to skip for pagination (default: 0)'
        required: false
        schema:
          type: integer
          minimum: 0
          default: 0
      - name: startDate
        in: query
        description: Filter transactions starting on or after this date (ISO8601)
        required: false
        schema:
          type: string
          format: date-time
      - name: endDate
        in: query
        description: Filter transactions starting on or before this date (ISO8601)
        required: false
        schema:
          type: string
          format: date-time
      responses:
        '200':
          description: List of transactions
          content:
            application/json:
              schema:
                $ref: '../schemas/schemas.yaml#/components/schemas/TransactionList'
        '401':
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: '../schemas/schemas.yaml#/components/schemas/Status'
        '403':
          description: The caller does not have the permission of the operation
          content:
            application/json:
              schema:
                $ref: '../schemas/schemas.yaml#/components/schemas/Status'
        '404':
          description: Unknown charge station
          content:
            application/json:
              schema:
                $ref: '../schemas/schemas.yaml#/components/schemas/Status'
        default:
          description: Unexpected error
          content:
            application/json:
              schema:
                $ref: '../schemas/schemas.yaml#/components/schemas/Status'
  /cs/{csId}/transaction/{transactionId}:
    get:
      summary: Get transaction details
      description: 'Retrieves detailed information about a specific transaction including

        all meter values.

        '
      operationId: getTransactionDetails
      x-permission: cpms.session.read
      parameters:
      - name: csId
        in: path
        description: The charge station identifier
        required: true
        schema:
          type: string
          maxLength: 80
      - name: transactionId
        in: path
        description: The transaction identifier
        required: true
        schema:
          type: string
          maxLength: 36
      responses:
        '200':
          description: Transaction details
          content:
            application/json:
              schema:
                $ref: '../schemas/schemas.yaml#/components/schemas/TransactionDetail'
        '401':
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: '../schemas/schemas.yaml#/components/schemas/Status'
        '403':
          description: The caller does not have the permission of the operation
          content:
            application/json:
              schema:
                $ref: '../schemas/schemas.yaml#/components/schemas/Status'
        '404':
          description: Transaction not found
          content:
            application/json:
              schema:
                $ref: '../schemas/schemas.yaml#/components/schemas/Status'
        default:
          description: Unexpected error
          content:
            application/json:
              schema:
                $ref: '../schemas/schemas.yaml#/components/schemas/Status'
  /cs/{csId}/start-transaction:
    post:
      summary: Remote start transaction
      description: 'Remotely starts a charging transaction on the specified charge
        station.

        This is an async operation that returns immediately with 202 Accepted.

        For an OCPP 1.6 charge station the request becomes a command of the command queue
        (`GET /commands/{commandId}`): it is sent when the charge station is connected,
        and the answer of the charge station is the result of the command.

        '
      operationId: remoteStartTransaction
      x-permission: cpms.connector.command
      parameters:
      - name: csId
        in: path
        description: The charge station identifier
        schema:
          type: string
          maxLength: 80
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '../schemas/schemas.yaml#/components/schemas/RemoteStartTransactionRequest'
      responses:
        '202':
          description: |
            Accepted - remote start initiated.
            For an OCPP 1.6 charge station the request is queued as a command, which is
            the body, and `Location` names it. For other charge stations, and when the
            storage engine of the manager does not keep commands, the body is empty.
          headers:
            Location:
              description: Where the command can be read (OCPP 1.6 charge stations only)
              schema:
                type: string
          content:
            application/json:
              schema:
                $ref: '../schemas/schemas.yaml#/components/schemas/Command'
        '400':
          description: |
            The request is not valid. For an OCPP 1.6 charge station the error starts with
            `invalid_payload` (followed by the schema error) when the request does not make
            a valid OCPP call.
          content:
            application/json:
              schema:
                $ref: '../schemas/schemas.yaml#/components/schemas/Status'
        '401':
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: '../schemas/schemas.yaml#/components/schemas/Status'
        '403':
          description: The caller does not have the permission of the operation
          content:
            application/json:
              schema:
                $ref: '../schemas/schemas.yaml#/components/schemas/Status'
        '404':
          description: Unknown charge station
          content:
            application/json:
              schema:
                $ref: '../schemas/schemas.yaml#/components/schemas/Status'
        '409':
          description: |
            The OCPP version of the charge station could not be found when the command
            was queued (error `station_version_unknown`), or the charge station may not
            charge because it is pending or decommissioned (error `station_not_active`)
          content:
            application/json:
              schema:
                $ref: '../schemas/schemas.yaml#/components/schemas/Status'
        default:
          description: Unexpected error
          content:
            application/json:
              schema:
                $ref: '../schemas/schemas.yaml#/components/schemas/Status'
  /cs/{csId}/stop-transaction:
    post:
      summary: Remote stop transaction
      description: 'Remotely stops an active charging transaction on the specified
        charge station.

        This is an async operation that returns immediately with 202 Accepted.

        For an OCPP 1.6 charge station the request becomes a command of the command queue
        (`GET /commands/{commandId}`): it is sent when the charge station is connected,
        and the answer of the charge station is the result of the command.
        `transactionId` is then the OCPP transaction id or the id of the transaction in
        the manager (the id that the transaction list shows); any other value is refused
        with 400.

        '
      operationId: remoteStopTransaction
      x-permission: cpms.connector.command
      parameters:
      - name: csId
        in: path
        description: The charge station identifier
        schema:
          type: string
          maxLength: 80
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '../schemas/schemas.yaml#/components/schemas/RemoteStopTransactionRequest'
      responses:
        '202':
          description: |
            Accepted - remote stop initiated.
            For an OCPP 1.6 charge station the request is queued as a command, which is
            the body, and `Location` names it. For other charge stations, and when the
            storage engine of the manager does not keep commands, the body is empty.
          headers:
            Location:
              description: Where the command can be read (OCPP 1.6 charge stations only)
              schema:
                type: string
          content:
            application/json:
              schema:
                $ref: '../schemas/schemas.yaml#/components/schemas/Command'
        '400':
          description: |
            The request is not valid. For an OCPP 1.6 charge station the error starts with
            `invalid_payload` (followed by the schema error) when the request does not make
            a valid OCPP call.
          content:
            application/json:
              schema:
                $ref: '../schemas/schemas.yaml#/components/schemas/Status'
        '401':
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: '../schemas/schemas.yaml#/components/schemas/Status'
        '403':
          description: The caller does not have the permission of the operation
          content:
            application/json:
              schema:
                $ref: '../schemas/schemas.yaml#/components/schemas/Status'
        '404':
          description: Unknown charge station
          content:
            application/json:
              schema:
                $ref: '../schemas/schemas.yaml#/components/schemas/Status'
        '409':
          description: |
            The OCPP version of the charge station could not be found when the command
            was queued (error `station_version_unknown`)
          content:
            application/json:
              schema:
                $ref: '../schemas/schemas.yaml#/components/schemas/Status'
        default:
          description: Unexpected error
          content:
            application/json:
              schema:
                $ref: '../schemas/schemas.yaml#/components/schemas/Status'
