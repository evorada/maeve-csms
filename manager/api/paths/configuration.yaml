paths:
  /cs/{csId}/reconfigure:
    post:
      summary: Reconfigure the charge station
      description: 'Supplies new configuration that should be applied to the charge
        station. This is not

        intended to be used as a general charge station provisioning mechanism, it
        is intended

        for one time changes required during testing. After reconfiguration, the charge
        station

        will be rebooted so the new configuration can take effect if instructed to.

        '
      operationId: reconfigureChargeStation
      x-permission: cpms.station.write
      parameters:
      - name: csId
        in: path
        description: The charge station identifier
        schema:
          type: string
          maxLength: 80
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '../schemas/schemas.yaml#/components/schemas/ChargeStationSettings'
      responses:
        '200':
          description: OK
        '401':
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: '../schemas/schemas.yaml#/components/schemas/Status'
        '403':
          description: The caller does not have the permission of the operation, or the tenant is suspended (error `tenant_suspended`)
          content:
            application/json:
              schema:
                $ref: '../schemas/schemas.yaml#/components/schemas/Status'
        '404':
          description: Unknown charge station
          content:
            application/json:
              schema:
                $ref: '../schemas/schemas.yaml#/components/schemas/Status'
        default:
          description: Unexpected error
          content:
            application/json:
              schema:
                $ref: '../schemas/schemas.yaml#/components/schemas/Status'
  /cs/{csId}/configuration:
    get:
      summary: Get charge station configuration (OCPP 1.6)
      description: |
        Answers the configuration of a charge station that the manager knows, optionally
        only the given keys.

        With `refresh=true` an OCPP 1.6 charge station is asked for its configuration
        instead: the request queues a `GetConfiguration` command for the given keys (all
        keys without `key`) and answers 202 with the command; the configuration is the
        result of the command, and the manager keeps the values that the charge station
        answers. Refreshing needs the permission `cpms.connector.command` as well. Other
        charge stations, and a manager whose storage engine does not keep commands, answer
        what the manager knows.
      operationId: getChargeStationConfiguration
      x-permission: cpms.station.read
      parameters:
      - name: csId
        in: path
        description: The charge station identifier
        required: true
        schema:
          type: string
          maxLength: 80
      - name: key
        in: query
        description: Comma-separated list of configuration keys to retrieve
        required: false
        schema:
          type: string
      - name: refresh
        in: query
        description: Ask an OCPP 1.6 charge station for its configuration
        required: false
        schema:
          type: boolean
          default: false
      responses:
        '200':
          description: Configuration response
          content:
            application/json:
              schema:
                $ref: '../schemas/schemas.yaml#/components/schemas/ConfigurationResponse'
        '202':
          description: |
            With `refresh=true`, for an OCPP 1.6 charge station: the `GetConfiguration`
            command that asks the charge station
          headers:
            Location:
              description: Where the command can be read (OCPP 1.6 charge stations only)
              schema:
                type: string
          content:
            application/json:
              schema:
                $ref: '../schemas/schemas.yaml#/components/schemas/Command'
        '400':
          description: |
            The request is not valid. For an OCPP 1.6 charge station the error starts with
            `invalid_payload` (followed by the schema error) when the request does not make
            a valid OCPP call.
          content:
            application/json:
              schema:
                $ref: '../schemas/schemas.yaml#/components/schemas/Status'
        '401':
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: '../schemas/schemas.yaml#/components/schemas/Status'
        '403':
          description: |
            The caller does not have the permission of the operation, or asks for
            `refresh=true` without the permission `cpms.connector.command`
          content:
            application/json:
              schema:
                $ref: '../schemas/schemas.yaml#/components/schemas/Status'
        '404':
          description: Unknown charge station
          content:
            application/json:
              schema:
                $ref: '../schemas/schemas.yaml#/components/schemas/Status'
        '409':
          description: |
            The OCPP version of the charge station could not be found when the command
            was queued (error `station_version_unknown`)
          content:
            application/json:
              schema:
                $ref: '../schemas/schemas.yaml#/components/schemas/Status'
        default:
          description: Unexpected error
          content:
            application/json:
              schema:
                $ref: '../schemas/schemas.yaml#/components/schemas/Status'
    patch:
      summary: Change charge station configuration (OCPP 1.6)
      description: |
        Changes configuration values on a charge station using OCPP 1.6 ChangeConfiguration.
        Returns 202 Accepted with per-key results. Some changes may require a reboot.

        For an OCPP 1.6 charge station each key becomes a `ChangeConfiguration` command of
        the command queue (`GET /commands/{commandId}`), sent once when the charge station
        is connected: every result has the status `Pending` and the id of its command
        (`commandId`), and the status that the charge station answers is the result of
        the command.
      operationId: changeChargeStationConfiguration
      x-permission: cpms.station.write
      parameters:
      - name: csId
        in: path
        description: The charge station identifier
        required: true
        schema:
          type: string
          maxLength: 80
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '../schemas/schemas.yaml#/components/schemas/ConfigurationChangeRequest'
      responses:
        '202':
          description: Accepted - configuration change initiated
          content:
            application/json:
              schema:
                $ref: '../schemas/schemas.yaml#/components/schemas/ConfigurationChangeResponse'
        '400':
          description: |
            The request is not valid. For an OCPP 1.6 charge station the error starts with
            `invalid_payload` (followed by the schema error) when the request does not make
            a valid OCPP call.
          content:
            application/json:
              schema:
                $ref: '../schemas/schemas.yaml#/components/schemas/Status'
        '401':
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: '../schemas/schemas.yaml#/components/schemas/Status'
        '403':
          description: The caller does not have the permission of the operation, or the tenant is suspended (error `tenant_suspended`)
          content:
            application/json:
              schema:
                $ref: '../schemas/schemas.yaml#/components/schemas/Status'
        '404':
          description: Unknown charge station
          content:
            application/json:
              schema:
                $ref: '../schemas/schemas.yaml#/components/schemas/Status'
        '409':
          description: |
            The OCPP version of the charge station could not be found when the command
            was queued (error `station_version_unknown`)
          content:
            application/json:
              schema:
                $ref: '../schemas/schemas.yaml#/components/schemas/Status'
        default:
          description: Unexpected error
          content:
            application/json:
              schema:
                $ref: '../schemas/schemas.yaml#/components/schemas/Status'
  /cs/{csId}/variables:
    get:
      summary: Get charge station variables (OCPP 2.0.1)
      description: 'Retrieves variables from a charge station using OCPP 2.0.1 GetVariables.

        Optionally filter by component and/or variable name.

        '
      operationId: getChargeStationVariables
      x-permission: cpms.station.read
      parameters:
      - name: csId
        in: path
        description: The charge station identifier
        required: true
        schema:
          type: string
          maxLength: 80
      - name: component
        in: query
        description: Filter by component name
        required: false
        schema:
          type: string
      - name: variable
        in: query
        description: Filter by variable name
        required: false
        schema:
          type: string
      responses:
        '200':
          description: Variables response
          content:
            application/json:
              schema:
                $ref: '../schemas/schemas.yaml#/components/schemas/VariablesResponse'
        '401':
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: '../schemas/schemas.yaml#/components/schemas/Status'
        '403':
          description: The caller does not have the permission of the operation
          content:
            application/json:
              schema:
                $ref: '../schemas/schemas.yaml#/components/schemas/Status'
        '404':
          description: Unknown charge station
          content:
            application/json:
              schema:
                $ref: '../schemas/schemas.yaml#/components/schemas/Status'
        default:
          description: Unexpected error
          content:
            application/json:
              schema:
                $ref: '../schemas/schemas.yaml#/components/schemas/Status'
    patch:
      summary: Set charge station variables (OCPP 2.0.1)
      description: 'Sets variable values on a charge station using OCPP 2.0.1 SetVariables.

        Returns 202 Accepted with per-variable results.

        '
      operationId: setChargeStationVariables
      x-permission: cpms.station.write
      parameters:
      - name: csId
        in: path
        description: The charge station identifier
        required: true
        schema:
          type: string
          maxLength: 80
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '../schemas/schemas.yaml#/components/schemas/VariablesChangeRequest'
      responses:
        '202':
          description: Accepted - variable change initiated
          content:
            application/json:
              schema:
                $ref: '../schemas/schemas.yaml#/components/schemas/VariablesChangeResponse'
        '401':
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: '../schemas/schemas.yaml#/components/schemas/Status'
        '403':
          description: The caller does not have the permission of the operation, or the tenant is suspended (error `tenant_suspended`)
          content:
            application/json:
              schema:
                $ref: '../schemas/schemas.yaml#/components/schemas/Status'
        '404':
          description: Unknown charge station
          content:
            application/json:
              schema:
                $ref: '../schemas/schemas.yaml#/components/schemas/Status'
        default:
          description: Unexpected error
          content:
            application/json:
              schema:
                $ref: '../schemas/schemas.yaml#/components/schemas/Status'
