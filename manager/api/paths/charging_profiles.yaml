paths:
  /cs/{csId}/charging-profile:
    post:
      summary: Set charging profile
      description: |
        Sets a charging profile for a specific connector on the charge station.
        Used for smart charging, load balancing, and dynamic pricing.

        For an OCPP 1.6 charge station the request becomes a `SetChargingProfile` command of
        the command queue (`GET /commands/{commandId}`): it is sent when the charge station is
        connected, the answer of the charge station is the result of the command, and the
        profile is stored (and listed) only when the charge station accepts it. Other charge
        stations get the profile stored at once.
      operationId: setChargingProfile
      x-permission: cpms.connector.command
      parameters:
      - name: csId
        in: path
        required: true
        schema:
          type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '../schemas/schemas.yaml#/components/schemas/SetChargingProfileRequest'
      responses:
        '202':
          description: |
            Accepted - charging profile request queued.
            For an OCPP 1.6 charge station the request is queued as a command, which is
            the body, and `Location` names it. For other charge stations, and when the
            storage engine of the manager does not keep commands, the body is empty.
          headers:
            Location:
              description: Where the command can be read (OCPP 1.6 charge stations only)
              schema:
                type: string
          content:
            application/json:
              schema:
                $ref: '../schemas/schemas.yaml#/components/schemas/Command'
        '400':
          description: |
            The request is not valid. For an OCPP 1.6 charge station the error starts with
            `invalid_payload` (followed by the schema error) when the request does not make
            a valid OCPP call.
          content:
            application/json:
              schema:
                $ref: '../schemas/schemas.yaml#/components/schemas/Status'
        '401':
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: '../schemas/schemas.yaml#/components/schemas/Status'
        '403':
          description: The caller does not have the permission of the operation
          content:
            application/json:
              schema:
                $ref: '../schemas/schemas.yaml#/components/schemas/Status'
        '404':
          description: Unknown charge station
          content:
            application/json:
              schema:
                $ref: '../schemas/schemas.yaml#/components/schemas/Status'
        '409':
          description: |
            The OCPP version of the charge station could not be found when the command
            was queued (error `station_version_unknown`)
          content:
            application/json:
              schema:
                $ref: '../schemas/schemas.yaml#/components/schemas/Status'
        default:
          description: Unexpected error
          content:
            application/json:
              schema:
                $ref: '../schemas/schemas.yaml#/components/schemas/Status'
    get:
      summary: Get charging profiles
      operationId: getChargingProfiles
      x-permission: cpms.station.read
      parameters:
      - name: csId
        in: path
        required: true
        schema:
          type: string
      - name: connectorId
        in: query
        required: false
        schema:
          type: integer
          minimum: 0
      - name: chargingProfilePurpose
        in: query
        required: false
        schema:
          type: string
          enum:
          - TxProfile
          - TxDefaultProfile
          - ChargePointMaxProfile
      - name: stackLevel
        in: query
        required: false
        schema:
          type: integer
          minimum: 0
      responses:
        '200':
          description: List of charging profiles
          content:
            application/json:
              schema:
                $ref: '../schemas/schemas.yaml#/components/schemas/ChargingProfileList'
        '401':
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: '../schemas/schemas.yaml#/components/schemas/Status'
        '403':
          description: The caller does not have the permission of the operation
          content:
            application/json:
              schema:
                $ref: '../schemas/schemas.yaml#/components/schemas/Status'
        '404':
          description: Unknown charge station
          content:
            application/json:
              schema:
                $ref: '../schemas/schemas.yaml#/components/schemas/Status'
        default:
          description: Unexpected error
          content:
            application/json:
              schema:
                $ref: '../schemas/schemas.yaml#/components/schemas/Status'
  /cs/{csId}/charging-profile/{profileId}:
    delete:
      summary: Clear charging profile
      description: |
        Clears the charging profile with the id, and with the other criteria that are
        given, from the charge station.

        For an OCPP 1.6 charge station the request becomes a `ClearChargingProfile`
        command of the command queue (`GET /commands/{commandId}`): it is sent when the
        charge station is connected, the answer of the charge station is the result of
        the command, and the profiles are cleared in the manager only when the charge
        station accepts. Other charge stations get them cleared at once.
      operationId: clearChargingProfile
      x-permission: cpms.connector.command
      parameters:
      - name: csId
        in: path
        required: true
        schema:
          type: string
      - name: profileId
        in: path
        required: true
        schema:
          type: integer
          minimum: 0
      - name: connectorId
        in: query
        required: false
        schema:
          type: integer
          minimum: 0
      - name: chargingProfilePurpose
        in: query
        required: false
        schema:
          type: string
          enum:
          - TxProfile
          - TxDefaultProfile
          - ChargePointMaxProfile
      - name: stackLevel
        in: query
        required: false
        schema:
          type: integer
          minimum: 0
      responses:
        '202':
          description: |
            Accepted - clear profile request queued.
            For an OCPP 1.6 charge station the request is queued as a command, which is
            the body, and `Location` names it. For other charge stations, and when the
            storage engine of the manager does not keep commands, the body is empty.
          headers:
            Location:
              description: Where the command can be read (OCPP 1.6 charge stations only)
              schema:
                type: string
          content:
            application/json:
              schema:
                $ref: '../schemas/schemas.yaml#/components/schemas/Command'
        '401':
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: '../schemas/schemas.yaml#/components/schemas/Status'
        '403':
          description: The caller does not have the permission of the operation
          content:
            application/json:
              schema:
                $ref: '../schemas/schemas.yaml#/components/schemas/Status'
        '404':
          description: Unknown charge station
          content:
            application/json:
              schema:
                $ref: '../schemas/schemas.yaml#/components/schemas/Status'
        '409':
          description: |
            The OCPP version of the charge station could not be found when the command
            was queued (error `station_version_unknown`)
          content:
            application/json:
              schema:
                $ref: '../schemas/schemas.yaml#/components/schemas/Status'
        default:
          description: Unexpected error
          content:
            application/json:
              schema:
                $ref: '../schemas/schemas.yaml#/components/schemas/Status'
  /cs/{csId}/composite-schedule:
    get:
      summary: Get composite schedule
      operationId: getCompositeSchedule
      x-permission: cpms.station.read
      parameters:
      - name: csId
        in: path
        required: true
        schema:
          type: string
      - name: connectorId
        in: query
        required: true
        schema:
          type: integer
          minimum: 0
      - name: duration
        in: query
        required: false
        schema:
          type: integer
          minimum: 1
          default: 3600
      - name: chargingRateUnit
        in: query
        required: false
        schema:
          type: string
          enum:
          - W
          - A
          default: A
      responses:
        '200':
          description: Composite schedule
          content:
            application/json:
              schema:
                $ref: '../schemas/schemas.yaml#/components/schemas/CompositeSchedule'
        '401':
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: '../schemas/schemas.yaml#/components/schemas/Status'
        '403':
          description: The caller does not have the permission of the operation
          content:
            application/json:
              schema:
                $ref: '../schemas/schemas.yaml#/components/schemas/Status'
        '404':
          description: Unknown charge station
          content:
            application/json:
              schema:
                $ref: '../schemas/schemas.yaml#/components/schemas/Status'
        default:
          description: Unexpected error
          content:
            application/json:
              schema:
                $ref: '../schemas/schemas.yaml#/components/schemas/Status'
