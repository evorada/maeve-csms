paths:
  /cs/{csId}/data-transfer:
    post:
      summary: Send data transfer to charge station
      description: 'Sends vendor-specific data to a charge station. The data format
        and semantics

        are defined by the vendor. Supports both OCPP 1.6 and OCPP 2.0.1.

        '
      operationId: sendDataTransfer
      x-permission: cpms.connector.command
      parameters:
      - name: csId
        in: path
        description: The charge station identifier
        schema:
          type: string
          maxLength: 80
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '../schemas/schemas.yaml#/components/schemas/DataTransferRequest'
      responses:
        '202':
          description: Accepted - data transfer request submitted
          content:
            application/json:
              schema:
                $ref: '../schemas/schemas.yaml#/components/schemas/DataTransferResponse'
        '401':
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: '../schemas/schemas.yaml#/components/schemas/Status'
        '403':
          description: The caller does not have the permission of the operation
          content:
            application/json:
              schema:
                $ref: '../schemas/schemas.yaml#/components/schemas/Status'
        '404':
          description: Unknown charge station
          content:
            application/json:
              schema:
                $ref: '../schemas/schemas.yaml#/components/schemas/Status'
        default:
          description: Unexpected error
          content:
            application/json:
              schema:
                $ref: '../schemas/schemas.yaml#/components/schemas/Status'
