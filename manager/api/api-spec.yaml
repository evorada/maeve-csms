openapi: 3.0.0
info:
  version: 0.0.0
  title: MaEVe CSMS
  description: Internal API to interact with the MaEVe CSMS, external clients should use OCPI.
  contact:
    name: MaEVe team
    email: maeve-team@thoughtworks.com
  license:
    name: Apache 2.0
servers:
- url: http://localhost:9410/api/v0
  description: The local development server
# Every operation needs a token that the platform minted for the caller.
security:
- bearerAuth: []
paths:
  /cs/{csId}:
    $ref: 'paths/auth.yaml#/paths/~1cs~1{csId}'
  /cs/{csId}/reconfigure:
    $ref: 'paths/configuration.yaml#/paths/~1cs~1{csId}~1reconfigure'
