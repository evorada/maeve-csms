  /cs/{csId}/start-transaction:
    post:
      summary: Remote start transaction
      description: |
        Remotely starts a charging transaction on the specified charge station.
        This is an async operation that returns immediately with 202 Accepted.
        For an OCPP 1.6 charge station the request becomes a command of the command queue (`GET /commands/{commandId}`): it is sent when the charge station is connected, and the answer of the charge station is the result of the command.
      operationId: remoteStartTransaction
      x-permission: cpms.connector.command
      parameters:
        - name: csId
          in: path
          description: The charge station identifier
          schema:
            type: string
            maxLength: 80
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RemoteStartTransactionRequest'
      responses:
        '202':
          description: |
            Accepted - remote start initiated.
            For an OCPP 1.6 charge station the request is queued as a command, which is
            the body, and `Location` names it. For other charge stations, and when the
            storage engine of the manager does not keep commands, the body is empty.
          headers:
            Location:
              description: Where the command can be read (OCPP 1.6 charge stations only)
              schema:
                type: string
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Command'
        '400':
          description: |
            The request is not valid. For an OCPP 1.6 charge station the error starts with
            `invalid_payload` (followed by the schema error) when the request does not make
            a valid OCPP call.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Status'
        '401':
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Status'
        '403':
          description: The caller does not have the permission of the operation
          content:
            application/json:
