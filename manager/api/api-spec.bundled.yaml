  /cs/{csId}/trigger:
    post:
      summary: Trigger a message from a charge station
      description: |
        Asks the charge station to send a message. For an OCPP 1.6 charge station the
        request becomes a command of the command queue (`GET /commands/{commandId}`):
        `BootNotification`, `DiagnosticsStatusNotification`, `FirmwareStatusNotification`,
        `Heartbeat`, `MeterValues` and `StatusNotification` are sent as an OCPP 1.6
        `TriggerMessage`, every other message as a `DataTransfer` of the vendor
        `org.openchargealliance.iso15118pnc` with the OCPP 2.0.1 `TriggerMessage` request
        as its data.
      operationId: triggerChargeStation
      x-permission: cpms.connector.command
      parameters:
        - name: csId
          in: path
          description: The charge station identifier
          schema:
            type: string
            maxLength: 80
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ChargeStationTrigger'
      responses:
        '201':
          description: |
            The message is requested.
            For an OCPP 1.6 charge station the request is queued as a command, which is
            the body, and `Location` names it. For other charge stations, and when the
            storage engine of the manager does not keep commands, the body is empty.
          headers:
            Location:
              description: Where the command can be read (OCPP 1.6 charge stations only)
              schema:
                type: string
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Command'
        '400':
          description: |
            The request is not valid. For an OCPP 1.6 charge station the error starts with
            `invalid_payload` (followed by the schema error) when the request does not make
            a valid OCPP call.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Status'
        '401':
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Status'
        '403':
          description: The caller does not have the permission of the operation
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Status'
        '404':
          description: Unknown charge station
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Status'
        '409':
          description: |
            The OCPP version of the charge station could not be found when the command
            was queued (error `station_version_unknown`)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Status'
        default:
          description: Unexpected error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Status'
  /cs/{csId}/firmware/update:
    post:
      summary: Trigger firmware update on charge station
      description: |
        Initiates a firmware update on the specified charge station. Supports both regular
        and signed firmware updates. The charge station will download and install the
        firmware from the provided location.

        For an OCPP 1.6 charge station the request becomes a command of the command queue
        (`GET /commands/{commandId}`): `UpdateFirmware`, or `SignedUpdateFirmware` when both
        `signature` and `signingCertificate` are given (only one of them is refused). Without
        `retrieveDate` the firmware is retrieved at once. The command is sent when the charge
        station is connected, and the answer of the charge station is the result of the
        command.
      operationId: updateChargeStationFirmware
      x-permission: cpms.connector.command
      parameters:
        - name: csId
          in: path
          description: The charge station identifier
          schema:
            type: string
            maxLength: 80
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/FirmwareUpdateRequest'
      responses:
        '202':
          description: |
            Accepted - firmware update initiated.
            For an OCPP 1.6 charge station the request is queued as a command, which is
            the body, and `Location` names it. For other charge stations, and when the
            storage engine of the manager does not keep commands, the body is empty.
          headers:
            Location:
              description: Where the command can be read (OCPP 1.6 charge stations only)
              schema:
                type: string
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Command'
        '400':
          description: |
            The request is not valid. For an OCPP 1.6 charge station: only one of
            `signature` and `signingCertificate` is given, or the error starts with
            `invalid_payload` (followed by the schema error) when the request does not make a
            valid OCPP call.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Status'
        '401':
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Status'
        '403':
          description: The caller does not have the permission of the operation
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Status'
        '404':
          description: Unknown charge station
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Status'
        '409':
          description: |
            The OCPP version of the charge station could not be found when the command
            was queued (error `station_version_unknown`)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Status'
        default:
          description: Unexpected error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Status'
