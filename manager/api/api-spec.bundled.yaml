  /cs/{csId}/diagnostics:
    post:
      summary: Request diagnostics from charge station
      description: |
        Initiates a diagnostics upload from the specified charge station (OCPP 1.6).
        The charge station will collect diagnostics and upload them to the provided
        location.

        For an OCPP 1.6 charge station the request becomes a `GetDiagnostics` command of the
        command queue (`GET /commands/{commandId}`): it is sent when the charge station is
        connected, and the answer of the charge station (the name of the file it uploads) is
