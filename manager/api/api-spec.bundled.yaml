openapi: 3.0.0
info:
  version: 0.0.0
  title: MaEVe CSMS
  description: Internal API to interact with the MaEVe CSMS, external clients should use OCPI.
  contact:
    name: MaEVe team
    email: maeve-team@thoughtworks.com
  license:
    name: Apache 2.0
servers:
  - url: http://localhost:9410/api/v0
    description: The local development server
security:
  - bearerAuth: []
paths:
  /cs:
    get:
      summary: List charge stations
      description: |
        Lists the charge stations of the orgs that the caller may reach, ordered by station
        key, one page at a time. `next_cursor` is the `cursor` of the next page, and `null`
        after the last page. Every filter that is given narrows the list; a repeated `state`
        or `status` matches any of its values.
      operationId: listChargeStations
      x-permission: cpms.station.read
      parameters:
        - name: limit
          in: query
          description: Maximum number of charge stations to return
          required: false
          schema:
            type: integer
            minimum: 1
            maximum: 200
            default: 50
        - name: cursor
          in: query
          description: The `next_cursor` of the previous page; the first page without it
          required: false
          schema:
            type: string
        - name: location_id
          in: query
          description: Only charge stations at this location
          required: false
          schema:
            type: string
            format: uuid
        - name: state
          in: query
          description: Only charge stations in one of these states
          required: false
          style: form
          explode: true
          schema:
            type: array
            items:
              $ref: '#/components/schemas/ChargeStationState'
        - name: connected
          in: query
          description: Only charge stations whose connection is open (true) or not (false)
          required: false
          schema:
            type: boolean
        - name: status
          in: query
          description: |
            Only charge stations with a connector (connector 0, the charge station as a whole,
            included) whose current OCPP status is one of these
          required: false
          style: form
          explode: true
          schema:
            type: array
            items:
              $ref: '#/components/schemas/ConnectorStatusFilter'
        - name: vendor
          in: query
          description: Only charge stations whose vendor (from their last boot) is this, ignoring case
          required: false
          schema:
            type: string
        - name: model
          in: query
          description: Only charge stations whose model (from their last boot) is this, ignoring case
          required: false
          schema:
            type: string
        - name: q
          in: query
          description: Only charge stations whose station key, display name, serial number or ICCID contains this text, ignoring case
          required: false
          schema:
            type: string
      responses:
        '200':
          description: A page of charge stations
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ChargeStationPage'
        '400':
          description: The limit is out of range, the cursor is not one of a previous page, or a filter has a value that is not known
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Status'
        '401':
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Status'
        '403':
          description: The caller does not have the permission of the operation
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Status'
        '501':
          description: The storage engine of the manager does not keep the registry of the charge stations
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Status'
        default:
          description: Unexpected error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Status'
  /cs/{csId}:
    get:
      summary: Read a charge station
      description: |
        Returns the registry record of the charge station with what it reported at its last
        boot, whether its connection is open, and its EVSEs with their connectors and live
        status.
      operationId: getChargeStation
      x-permission: cpms.station.read
      parameters:
        - name: csId
          in: path
          description: The charge station identifier
          required: true
          schema:
            type: string
            maxLength: 80
      responses:
        '200':
          description: The charge station
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ChargeStationRecord'
        '401':
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Status'
        '403':
          description: The caller does not have the permission of the operation
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Status'
        '404':
          description: Unknown charge station
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Status'
        '501':
          description: The storage engine of the manager does not keep the registry of the charge stations
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Status'
        default:
          description: Unexpected error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Status'
    patch:
      summary: Change a charge station
      description: |
        Changes the registry record of the charge station as a JSON merge patch (RFC 7396):
        a field that the body leaves out stays as it is, `null` clears it. A new
        `location_id` moves the charge station and its EVSEs to that location of the org of
        the charge station; it can only be cleared while the charge station has no EVSEs.
        A decommissioned charge station cannot be changed.
      operationId: updateChargeStation
      x-permission: cpms.station.write
      parameters:
        - name: csId
          in: path
          description: The charge station identifier
          required: true
          schema:
            type: string
            maxLength: 80
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ChargeStationPatch'
      responses:
        '200':
          description: The charge station
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ChargeStationRecord'
        '400':
          description: The body is not a JSON object
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Status'
        '401':
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Status'
        '403':
          description: The caller does not have the permission of the operation, or the tenant is suspended (error `tenant_suspended`)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Status'
        '404':
          description: Unknown charge station
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Status'
        '409':
          description: The charge station is decommissioned (error `station_decommissioned`)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Status'
        '422':
          description: Fields of the body break a rule, or the location is not a location of the org of the charge station
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ValidationErrors'
        '501':
          description: The storage engine of the manager does not keep the registry of the charge stations
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Status'
        default:
          description: Unexpected error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Status'
    post:
      summary: Register a new charge station
      description: |
        Registers a new charge station. The system will assume that the charge station
        has not yet been provisioned and will place the charge station into a pending state
        so it can been configured when it sends a boot notification.
      operationId: registerChargeStation
      x-permission: cpms.station.write
      parameters:
        - name: csId
          in: path
          description: The charge station identifier
          schema:
            type: string
            maxLength: 80
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ChargeStationAuth'
      responses:
        '201':
          description: Created
        '401':
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Status'
        '403':
          description: The caller does not have the permission of the operation, the tenant is suspended (error `tenant_suspended`), or the charge station is new and a hard limit on the connectors of the tenant is used up (the error starts with `entitlement_limit_exceeded`)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Status'
        '404':
          description: Unknown charge station
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Status'
        '409':
          description: The charge station is decommissioned (error `station_decommissioned`); its id cannot be registered again
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Status'
        default:
          description: Unexpected error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Status'
  /cs/{csId}/decommission:
    post:
      summary: Decommission a charge station
      description: |
        Takes the charge station out of service: its state becomes `decommissioned` and its
        EVSEs `REMOVED`, and it can no longer connect (an open connection is not closed).
        It stays in the registry for its history, and its id cannot be registered again.
        While a transaction is running on it, it is only decommissioned with `force`.
      operationId: decommissionChargeStation
      x-permission: cpms.station.write
      parameters:
        - name: csId
          in: path
          description: The charge station identifier
          required: true
          schema:
            type: string
            maxLength: 80
      requestBody:
        required: false
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/DecommissionRequest'
      responses:
        '200':
          description: The decommissioned charge station
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ChargeStationRecord'
        '400':
          description: The body is not a JSON document of the operation
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Status'
        '401':
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Status'
        '403':
          description: The caller does not have the permission of the operation, or the tenant is suspended (error `tenant_suspended`)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Status'
        '404':
          description: Unknown charge station
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Status'
        '409':
          description: |
            The charge station is decommissioned already (error `station_decommissioned`), or
            a transaction is running on it and `force` is not true (error `active_transaction`)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Status'
        '422':
          description: Fields of the body break a rule
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ValidationErrors'
        '501':
          description: The storage engine of the manager does not keep the registry of the charge stations
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Status'
        default:
          description: Unexpected error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Status'
  /cs/{csId}/approve:
    post:
      summary: Approve a pending charge station
      description: |
        Approves a charge station that connected without being registered and waits for
        approval (state `pending`): it gets a location, its EVSEs with their connectors, and
        a password of its own, and becomes `active` and may charge.

        `password_mode` says how the charge station gets its password:
        - `rotate` (default): a new password is sent to the charge station through the
          command queue (OCPP 1.6 `ChangeConfiguration` of `AuthorizationKey`, OCPP 2.0.1
          `SetVariables` of `SecurityCtrlr.BasicAuthPassword`); the answer is 202 and the
          charge station stays `pending` (onboarding status `approving`) until it takes the
          password, then it becomes `active` (event `station.approved`). When it does not
          take it, the onboarding status becomes `credentials_failed` (event
          `station.approval_failed`) and the charge station can be approved again. The
          password is never shown and the command keeps it only until it is sent.
        - `manual`: the charge station becomes `active` at once with a new password, which
          the answer shows once (`password`) and which is set on the charge station by hand.
        - `keep_onboarding`: the charge station becomes `active` at once and keeps the
          onboarding password of its tenant, which it connected with (`shared_credentials`).
      operationId: approveChargeStation
      x-permission: cpms.station.write
      parameters:
        - name: csId
          in: path
          description: The charge station identifier
          required: true
          schema:
            type: string
            maxLength: 80
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ApproveRequest'
      responses:
        '200':
          description: The charge station is approved and active (`manual`, `keep_onboarding`)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApprovalResult'
        '202':
          description: The new password is being sent to the charge station (`rotate`)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApprovalResult'
        '400':
          description: The body is not a JSON document of the operation
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Status'
        '401':
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Status'
        '403':
          description: The caller does not have the permission of the operation, or the tenant is suspended (error `tenant_suspended`)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Status'
        '404':
          description: Unknown charge station
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Status'
        '409':
          description: |
            The charge station is not pending (error `invalid_state`), its new password is
            being sent to it (error `approval_in_progress`), its connectors would go beyond
            the connector limit of the tenant (error `entitlement_exceeded`), its OCPP
            version is not known because it has not booted (`rotate`, error
            `station_version_unknown`), or an EVSE id is taken (error `already_exists`)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Status'
        '422':
          description: |
            Fields of the body break a rule: the location is not one of the org of the
            charge station, an EVSE or a connector is not valid, or `keep_onboarding` is
            asked for a charge station that did not connect with the onboarding password of
            its tenant
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ValidationErrors'
        '501':
          description: The storage engine of the manager does not keep the registry of the charge stations, or (`rotate`) the commands
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Status'
        default:
          description: Unexpected error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Status'
  /cs/{csId}/reject:
    post:
      summary: Reject a pending charge station
      description: |
        Refuses a charge station that connected without being registered and waits for
        approval (state `pending`): it is `decommissioned` with the state reason
        `rejected: <reason>` and can no longer connect (an open connection is not closed).
        Its id cannot be registered or onboarded again. A new password that is still
        queued for it is not sent.
      operationId: rejectChargeStation
      x-permission: cpms.station.write
      parameters:
        - name: csId
          in: path
          description: The charge station identifier
          required: true
          schema:
            type: string
            maxLength: 80
      requestBody:
        required: false
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RejectRequest'
      responses:
        '200':
          description: The rejected charge station
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ChargeStationRecord'
        '400':
          description: The body is not a JSON document of the operation
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Status'
        '401':
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Status'
        '403':
          description: The caller does not have the permission of the operation, or the tenant is suspended (error `tenant_suspended`)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Status'
        '404':
          description: Unknown charge station
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Status'
        '409':
          description: The charge station is not pending (error `invalid_state`)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Status'
        '422':
          description: Fields of the body break a rule
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ValidationErrors'
        '501':
          description: The storage engine of the manager does not keep the registry of the charge stations
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Status'
        default:
          description: Unexpected error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Status'
  /cs/{csId}/reconfigure:
    post:
      summary: Reconfigure the charge station
      description: |
        Supplies new configuration that should be applied to the charge station. This is not
        intended to be used as a general charge station provisioning mechanism, it is intended
        for one time changes required during testing. After reconfiguration, the charge station
        will be rebooted so the new configuration can take effect if instructed to.
      operationId: reconfigureChargeStation
      x-permission: cpms.station.write
      parameters:
        - name: csId
          in: path
          description: The charge station identifier
          schema:
            type: string
            maxLength: 80
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ChargeStationSettings'
      responses:
        '200':
          description: OK
        '401':
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Status'
        '403':
          description: The caller does not have the permission of the operation, or the tenant is suspended (error `tenant_suspended`)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Status'
        '404':
          description: Unknown charge station
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Status'
        default:
          description: Unexpected error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Status'
  /cs/{csId}/certificates:
    get:
      summary: Get installed certificates from the charge station
      description: |
        Queries the charge station for installed certificates. Uses OCPP
        GetInstalledCertificateIds to retrieve certificate hash data for certificates
        currently installed on the charge station.

        For an OCPP 1.6 charge station the request becomes a `GetInstalledCertificateIds`
        command of the command queue (`GET /commands/{commandId}`), whose result holds the
        certificates. OCPP 1.6 knows two types: `CSMSRootCertificate` (sent as
        `CentralSystemRootCertificate`) and `ManufacturerRootCertificate`; another type, or
        no type, is refused (400).
      operationId: getInstalledCertificates
      x-permission: cpms.station.read
      parameters:
        - name: csId
          in: path
          description: The charge station identifier
          schema:
            type: string
            maxLength: 80
        - name: certificateType
          in: query
          description: Optional filter by certificate type
          required: false
          schema:
            type: string
            enum:
              - V2GRootCertificate
              - MORootCertificate
              - CSMSRootCertificate
              - V2GCertificateChain
              - ManufacturerRootCertificate
      responses:
        '202':
          description: |
            Request accepted, will query charge station asynchronously.
            For an OCPP 1.6 charge station the request is queued as a command:
            `operationId` is the id of the command, the outcome is its result, and
            `Location` names it. For other charge stations `operationId` is the charge
            station identifier.
          headers:
            Location:
              description: Where the command can be read (OCPP 1.6 charge stations only)
              schema:
                type: string
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/OperationResponse'
        '400':
          description: |
            For an OCPP 1.6 charge station: no `certificateType`, or a type that OCPP 1.6
            does not have (`not supported for OCPP 1.6 stations`)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Status'
        '401':
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Status'
        '403':
          description: The caller does not have the permission of the operation
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Status'
        '404':
          description: Unknown charge station
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Status'
        '409':
          description: |
            The OCPP version of the charge station could not be found when the command
            was queued (error `station_version_unknown`)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Status'
        default:
          description: Unexpected error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Status'
    post:
      summary: Install certificates on the charge station
      operationId: installChargeStationCertificates
      x-permission: cpms.station.write
      parameters:
        - name: csId
          in: path
          description: The charge station identifier
          schema:
            type: string
            maxLength: 80
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ChargeStationInstallCertificates'
      responses:
        '200':
          description: OK
        '401':
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Status'
        '403':
          description: The caller does not have the permission of the operation, or the tenant is suspended (error `tenant_suspended`)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Status'
        '404':
          description: Unknown charge station
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Status'
        default:
          description: Unexpected error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Status'
  /cs/{csId}/certificate:
    delete:
      summary: Delete a certificate from the charge station
      description: |
        Requests the charge station to delete a specific certificate identified by its hash
        data. Uses OCPP DeleteCertificate to remove the certificate from the charge station.

        For an OCPP 1.6 charge station the request becomes a `DeleteCertificate` command of
        the command queue (`GET /commands/{commandId}`): it is sent when the charge station is
        connected, and the answer of the charge station is the result of the command.
      operationId: deleteChargeStationCertificate
      x-permission: cpms.station.write
      parameters:
        - name: csId
          in: path
          description: The charge station identifier
          schema:
            type: string
            maxLength: 80
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CertificateHashDataRequest'
      responses:
        '202':
          description: |
            Request accepted, will delete certificate asynchronously.
            For an OCPP 1.6 charge station the request is queued as a command:
            `operationId` is the id of the command, the outcome is its result, and
            `Location` names it. For other charge stations `operationId` is the charge
            station identifier.
          headers:
            Location:
              description: Where the command can be read (OCPP 1.6 charge stations only)
              schema:
                type: string
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/OperationResponse'
        '400':
          description: |
            The request is not valid. For an OCPP 1.6 charge station the error starts with
            `invalid_payload` (followed by the schema error) when the request does not make
            a valid OCPP call.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Status'
        '401':
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Status'
        '403':
          description: The caller does not have the permission of the operation, or the tenant is suspended (error `tenant_suspended`)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Status'
        '404':
          description: Unknown charge station
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Status'
        '409':
          description: |
            The OCPP version of the charge station could not be found when the command
            was queued (error `station_version_unknown`)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Status'
        default:
          description: Unexpected error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Status'
  /cs/{csId}/auth:
    get:
      summary: Returns the authentication details
      description: |
        Returns the details required by the CSMS gateway to determine how to authenticate
        the charge station
      operationId: lookupChargeStationAuth
      x-permission: cpms.station.write
      parameters:
        - name: csId
          in: path
          description: The charge station identifier
          schema:
            type: string
            maxLength: 80
      responses:
        '200':
          description: Charge station auth response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ChargeStationAuth'
        '401':
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Status'
        '403':
