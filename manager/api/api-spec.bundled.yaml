  /token:
    post:
      summary: Create/update an authorization token
      description: |
        Creates or updates a token that can be used to authorize a charge. The token belongs to the org of the caller, or to `orgId` when the body names an org that the caller may reach.
      operationId: setToken
      x-permission: cpms.token.write
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/Token'
      responses:
        '201':
          description: Created
        '400':
          description: Invalid request, or `orgId` is missing for a caller whose own org is not a tenant here
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Status'
        '401':
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Status'
        '403':
          description: The caller does not have the permission of the operation, or the tenant is suspended (error `tenant_suspended`)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Status'
        '404':
          description: The org is outside the scope of the caller
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Status'
        default:
          description: Unexpected error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Status'
    get:
      summary: List authorization tokens
      description: |
        Lists the tokens of the orgs that the caller may reach
      operationId: listTokens
      x-permission: cpms.token.read
      parameters:
        - required: false
          in: query
          name: offset
          schema:
            type: integer
            minimum: 0
        - required: false
          in: query
          name: limit
          schema:
            type: integer
            minimum: 1
            maximum: 100
        - required: false
          in: query
          name: orgId
          description: Only list the tokens of this org. An org outside the scope of the caller gives an empty list
          schema:
            type: string
            format: uuid
      responses:
        '200':
          description: List of tokens
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Token'
        '401':
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Status'
        '403':
          description: The caller does not have the permission of the operation
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Status'
        default:
          description: Unexpected error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Status'
  /token/{tokenUid}:
    get:
      summary: Lookup an authorization token
      description: |
        Lookup a token that can be used to authorize a charge
      operationId: lookupToken
      x-permission: cpms.token.read
      parameters:
        - required: true
          in: path
          name: tokenUid
          schema:
            type: string
            maxLength: 36
        - required: false
          in: query
          name: orgId
          description: The org that owns the token. Without it the token is looked up in the org of the caller
          schema:
            type: string
            format: uuid
      responses:
        '200':
          description: Authorization token details
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Token'
        '401':
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Status'
        '403':
          description: The caller does not have the permission of the operation
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Status'
        '404':
          description: Not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Status'
        default:
          description: Unexpected error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Status'
    delete:
      summary: Delete an authorization token
      description: |
        Deletes the token of the org with the UID (the token of every party of the org
        that has the UID), in the org of the caller or in `orgId`. Deleting a token that
        does not exist succeeds as well.
      operationId: deleteToken
      x-permission: cpms.token.write
      parameters:
        - required: true
          in: path
          name: tokenUid
          schema:
            type: string
            maxLength: 36
        - required: false
          in: query
          name: orgId
          description: The org that owns the token. Without it the token is deleted in the org of the caller
          schema:
            type: string
            format: uuid
      responses:
        '204':
          description: Deleted, or there was no such token
        '400':
          description: '`orgId` is missing for a caller whose own org is not a tenant here'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Status'
        '401':
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Status'
        '403':
          description: The caller does not have the permission of the operation, or the tenant is suspended (error `tenant_suspended`)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Status'
        '404':
          description: The org is outside the scope of the caller
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Status'
        '501':
          description: The storage engine of the manager cannot delete the token of one org
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Status'
        default:
          description: Unexpected error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Status'
