[api]
addr = ":9410"
internal_addr = ":9412"
org_name = "Example"
host = "example.com"

[api.auth]
mode = "jwt"
jwks_url = "https://platform.example.com/.well-known/jwks.json"
issuer = "platform.example.com"
audience = "maeve-test"
min_refresh_interval = "10m"
clock_skew = "2s"
max_token_lifetime = "90s"

[api.auth.dev]
org_id = "0193b2c4-0000-7000-8000-00000000000b"
org_scope = "self"
perms = ["cpms.station.read", "cpms.token.read"]

[transport]
type = "mqtt"

[transport.mqtt]
urls = ["mqtt://127.0.0.1:1883"]
prefix = "cs"
group = "manager"

[ocpp]
heartbeat_interval = "10m"
ocpp16_enabled = false

[jobs]
runner = "local"
lease_bucket = "test_job_leases"
lease_ttl = "30s"
ensure_bucket = true
bucket_replicas = 3
sync_interval = "2m"
sync_retry_after = "5m"
reservation_expiry_interval = "30s"

[tenancy]
default_org_id = "0193b2c4-0000-7000-8000-00000000000a"

[events]
enabled = false

[connectivity]
last_seen_write_interval = "1m"
stale_after = "10m"
sweep_interval = "15s"

[commands]
response_timeout = "45s"
connect_dispatch_delay = "2s"
sweep_interval = "10s"
default_ttl = "2h"
max_ttl = "72h"
retention = "720h"

[commands.ttl]
Reset = "10m"
ChangeConfiguration = "24h"

[observability]
log_format = "text"
otel_collector_addr = "localhost:4317"
tls_keylog_file = "/keylog/manager.log"

[storage]
type = "firestore"
firestore.project_id = "*detect-project-id*"

[contract_cert_validator]
type = "ocsp"
ocsp.max_attempts = 3

[contract_cert_validator.ocsp.root_certs]
type = "opcp"
opcp.url = "https://open.plugncharge-test.hubject.com"
opcp.auth.type = "env_token"
opcp.auth.env_token.variable = "RCP_TOKEN"
opcp.ttl = "24h"

[contract_cert_provider]
type = "opcp"
opcp.url = "https://open.plugncharge-test.hubject.com"
opcp.auth.type = "env_token"
opcp.auth.env_token.variable = "EST_TOKEN"

[charge_station_cert_provider]
type = "opcp"
opcp.url = "https://open.plugncharge-test.hubject.com"
opcp.auth.type = "hubject_test_token"
opcp.auth.hubject_test_token.url = "https://hubject.stoplight.io/docs/open-plugncharge/6bb8b3bc79c2e-authorization-token"
opcp.auth.hubject_test_token.cache.file = "/tmp/hubject_token.txt"
opcp.auth.hubject_test_token.cache.ttl = "1h"

[tariff_service]
type = "kwh"