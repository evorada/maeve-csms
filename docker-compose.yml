networks:
  default:
    name: maeve-csms
    enable_ipv6: true
    ipam:
      config:
        - subnet: 2001:db8:a::/64
          gateway: 2001:db8:a::1

services:
  # The gateway and the manager exchange the OCPP messages through NATS (JetStream on).
  # For MQTT, see docs/gateway.md.
  nats:
    image: nats:2.10-alpine
    command: ["-js", "-sd", "/data", "-m", "8222"]
    ports: ["4222:4222", "8222:8222"]
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:8222/healthz"]
      interval: 10s
      timeout: 5s
      retries: 3

  gateway:
    build:
      context: gateway
    depends_on:
      nats:
        condition: service_healthy
      manager:
        condition: service_healthy
    command:
      - "serve"
      - "--ws-addr"
      - ":9310"
      - "--wss-addr"
      - ":9311"
      - "--status-addr"
      - ":9312"
      - "--tls-server-cert"
      - "/certificates/csms.pem"
      - "--tls-server-key"
      - "/certificates/csms.key"
      - "--tls-trust-cert"
      - "/certificates/trust.pem"
      - "--nats-url"
      - "nats://nats:4222"
      - "--manager-api-addr"
      - "http://manager:9412"
    ports:
      - "80:9310" # charge station ws
      - "443:9311" # charge station wss
      - "9312:9312" # status
    volumes:
      - type: bind
        source: ./config/certificates
        target: /certificates
        read_only: true
    healthcheck:
      test: ["CMD", "/usr/bin/curl", "-s", "--fail", "http://localhost:9312/health"]
      interval: 10s
      timeout: 10s
      retries: 3
    user: "${USER_ID}:${GROUP_ID}"

  manager:
    build:
      context: manager
    depends_on:
      nats:
        condition: service_healthy
      postgres:
        condition: service_healthy
    environment:
      ENVIRONMENT: dev
    command:
      - "serve"
      - "-c"
      - "/config/config.toml"
    volumes:
      - type: bind
        source: ./config/certificates
        target: /certificates
        read_only: true
      - type: bind
        source: ./config/manager
        target: /config
        read_only: true
    ports:
      - "9410:9410" # manager api
      - "9411:9411" # status
      # internal listener (health check, metrics, legacy pages): it has no
      # authentication, so it is only published on this machine, for local development
      - "127.0.0.1:9412:9412"
    healthcheck:
      test: ["CMD", "/usr/bin/curl", "-s", "--fail", "http://localhost:9412/health"]
      interval: 10s
      timeout: 10s
      retries: 3
    user: "${USER_ID}:${GROUP_ID}"

  postgres:
    image: postgres:15-alpine
    environment:
      POSTGRES_DB: maeve
      POSTGRES_USER: maeve
      POSTGRES_PASSWORD: maeve
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U maeve -d maeve"]
      interval: 10s
      timeout: 5s
      retries: 5
